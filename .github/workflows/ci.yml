name: Build and verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  h2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h2-test-results-and-coverage
          path: |
            target/surefire-reports/
            target/site/jacoco/
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_DATABASE: learnreserve_test
          MYSQL_USER: learnreserve
          MYSQL_PASSWORD: test-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B verify -Dspring.profiles.active=test,mysql-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mysql-test-results-and-coverage
          path: |
            target/surefire-reports/
            target/site/jacoco/
