openapi: 3.1.0
info:
  title: LearnReserve API
  description: "Learning resources, availability and transaction-safe bookings. All\
    \ timestamps require an offset (UTC recommended), at whole-second precision. Intervals\
    \ are [start, end). Use Authorize with a registered email and password. Admin\
    \ writes require ADMIN. Errors use application/problem+json."
  version: 1.0.0
servers:
- url: http://localhost:8080
  description: Generated server url
security:
- basicAuth: []
tags:
- name: Availability
  description: "Availability windows are exclusive-resource windows, not seat inventory"
- name: Accounts
  description: "Register a learner, then authenticate using HTTP Basic"
- name: Bookings
  description: Learners can access only their own bookings
paths:
  /api/v1/resources/{id}:
    get:
      tags:
      - Resources
      summary: "Get resource details, including inactive resources"
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResourceView"
        "400":
          description: Invalid request or validation failure
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: "Resource not found, or booking not owned by caller"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      security: []
    put:
      tags:
      - Resources
      summary: Update resource metadata (admin)
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResourceView"
        "400":
          description: Invalid request or validation failure
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: "Resource not found, or booking not owned by caller"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: Missing or invalid credentials
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "403":
          description: Insufficient role permissions
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: "Booking, availability, state, or data conflict; inspect code"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /api/v1/resources:
    get:
      tags:
      - Resources
      summary: Discover active resources
      description: Optional type and case-insensitive name/description search. Page
        is zero-based; size is 1–100.
      operationId: list
      parameters:
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - STUDY_ROOM
          - MENTORING
          - WORKSHOP
      - name: q
        in: query
        required: false
        schema:
          type: string
          default: ""
          maxLength: 100
          minLength: 0
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseResourceView"
        "400":
          description: Invalid request or validation failure
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      security: []
    post:
      tags:
      - Resources
      summary: Create a resource (admin)
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResourceView"
        "400":
          description: Invalid request or validation failure
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: Missing or invalid credentials
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "403":
          description: Insufficient role permissions
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: "Booking, availability, state, or data conflict; inspect code"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /api/v1/resources/{resourceId}/availability:
    get:
      tags:
      - Availability
      summary: Find remaining bookable intervals
      description: Required from/to timestamps; maximum query span 31 days. Returns
        active windows with free intervals clipped to the query and future time. Fully
        booked windows have an empty freeIntervals array. Results are advisory; booking
        rechecks under a database lock.
      operationId: available
      parameters:
      - name: resourceId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WindowView"
        "400":
          description: Invalid request or validation failure
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: "Resource not found, or booking not owned by caller"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      security: []
    post:
      tags:
      - Availability
      summary: Add an availability window (admin)
      description: "Future window, at most 31 days, with no overlap against other\
        \ active windows."
      operationId: create_1
      parameters:
      - name: resourceId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SlotRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SlotView"
        "400":
          description: Invalid request or validation failure
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: "Resource not found, or booking not owned by caller"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: Missing or invalid credentials
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "403":
          description: Insufficient role permissions
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: "Booking, availability, state, or data conflict; inspect code"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /api/v1/resources/{resourceId}/availability/{slotId}/close:
    post:
      tags:
      - Availability
      summary: Close an availability window (admin)
      description: "Send application/json with {}. Idempotent. Returns 409 if upcoming\
        \ or ongoing confirmed bookings exist. History is retained."
      operationId: close
      parameters:
      - name: resourceId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      - name: slotId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SlotView"
        "400":
          description: Invalid request or validation failure
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: "Resource not found, or booking not owned by caller"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: Missing or invalid credentials
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "403":
          description: Insufficient role permissions
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: "Booking, availability, state, or data conflict; inspect code"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /api/v1/bookings:
    get:
      tags:
      - Bookings
      summary: View your paginated booking history
      operationId: history
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - CONFIRMED
          - CANCELLED
          - COMPLETED
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseBookingView"
        "400":
          description: Invalid request or validation failure
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: Missing or invalid credentials
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "403":
          description: Insufficient role permissions
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
    post:
      tags:
      - Bookings
      summary: Reserve a resource interval
      description: At most 24 hours; must be in the future and contained in one active
        window. Overlap returns 409 BOOKING_CONFLICT. Adjacent bookings are allowed.
      operationId: book
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BookingView"
        "400":
          description: Invalid request or validation failure
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: Missing or invalid credentials
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "403":
          description: Insufficient role permissions
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: "Booking, availability, state, or data conflict; inspect code"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /api/v1/bookings/{id}/cancel:
    post:
      tags:
      - Bookings
      summary: Cancel your booking
      description: "Send Content-Type: application/json with {}. Cancellation is idempotent\
        \ and allowed only before the session starts."
      operationId: cancel
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BookingView"
        "400":
          description: Invalid request or validation failure
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: "Resource not found, or booking not owned by caller"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: Missing or invalid credentials
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "403":
          description: Insufficient role permissions
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: "Booking, availability, state, or data conflict; inspect code"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /api/v1/auth/register:
    post:
      tags:
      - Accounts
      summary: Register a learner account
      description: Public registration always creates a LEARNER; roles cannot be supplied.
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserView"
        "400":
          description: Invalid request or validation failure
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: "Booking, availability, state, or data conflict; inspect code"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      security: []
  /api/v1/resources/{id}/active:
    patch:
      tags:
      - Resources
      summary: Activate or deactivate a resource (admin)
      description: Deactivation blocks new bookings but preserves existing reservations
        and history.
      operationId: active
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActiveRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResourceView"
        "400":
          description: Invalid request or validation failure
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: "Resource not found, or booking not owned by caller"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: Missing or invalid credentials
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "403":
          description: Insufficient role permissions
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: "Booking, availability, state, or data conflict; inspect code"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /api/v1/bookings/{id}:
    get:
      tags:
      - Bookings
      summary: View your booking
      operationId: get_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BookingView"
        "400":
          description: Invalid request or validation failure
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: "Resource not found, or booking not owned by caller"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: Missing or invalid credentials
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "403":
          description: Insufficient role permissions
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /api/v1/auth/me:
    get:
      tags:
      - Accounts
      summary: View the authenticated account
      operationId: me
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserView"
        "400":
          description: Invalid request or validation failure
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: Missing or invalid credentials
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "403":
          description: Insufficient role permissions
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
components:
  schemas:
    ResourceRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 150
          minLength: 0
        description:
          type: string
          maxLength: 2000
          minLength: 0
        type:
          type: string
          enum:
          - STUDY_ROOM
          - MENTORING
          - WORKSHOP
        location:
          type: string
          maxLength: 200
          minLength: 0
      required:
      - description
      - location
      - name
      - type
    ResourceView:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum:
          - STUDY_ROOM
          - MENTORING
          - WORKSHOP
        location:
          type: string
        active:
          type: boolean
    SlotRequest:
      type: object
      properties:
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
      required:
      - endsAt
      - startsAt
    SlotView:
      type: object
      properties:
        id:
          type: integer
          format: int64
        resourceId:
          type: integer
          format: int64
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        active:
          type: boolean
    BookingRequest:
      type: object
      properties:
        resourceId:
          type: integer
          format: int64
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
      required:
      - endsAt
      - resourceId
      - startsAt
    BookingView:
      type: object
      properties:
        id:
          type: integer
          format: int64
        resourceId:
          type: integer
          format: int64
        resourceName:
          type: string
        slotId:
          type: integer
          format: int64
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - CONFIRMED
          - CANCELLED
          - COMPLETED
        createdAt:
          type: string
          format: date-time
        cancelledAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 0
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 0
        password:
          type: string
          format: password
          maxLength: 72
          minLength: 12
          writeOnly: true
      required:
      - email
      - name
      - password
    UserView:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
          - LEARNER
          - ADMIN
    ActiveRequest:
      type: object
      properties:
        active:
          type: boolean
      required:
      - active
    PageResponseResourceView:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/ResourceView"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    IntervalView:
      type: object
      properties:
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
    WindowView:
      type: object
      properties:
        slotId:
          type: integer
          format: int64
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        freeIntervals:
          type: array
          items:
            $ref: "#/components/schemas/IntervalView"
    PageResponseBookingView:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/BookingView"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    ApiProblem:
      type: object
      properties:
        type:
          type: string
          example: urn:learnreserve:error:booking-conflict
        title:
          type: string
          example: Conflict
        status:
          type: integer
          format: int32
          example: 409
        detail:
          type: string
        instance:
          type: string
          example: /api/v1/bookings
        code:
          type: string
          example: BOOKING_CONFLICT
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
