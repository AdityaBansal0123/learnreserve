spring:
  application:
    name: learnreserve
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/learnreserve?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:learnreserve}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 12
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
springdoc:
  override-with-generic-response: false
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: false
    operations-sorter: alpha
app:
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  completion:
    enabled: true
    delay-ms: 60000
